<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Boord Packhouse</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Packhouse">
<meta name="theme-color" content="#0A2F6B">
<script src="shared/tailwind.js"></script>
<link rel="stylesheet" href="shared/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="shared/styles.css">
<script src="shared/api.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

<div class="boord-header p-3">
  <div class="flex items-center justify-between max-w-4xl mx-auto gap-3">
    <div class="flex-1 min-w-0">
      <div class="font-bold text-lg truncate" id="title">Boord Packhouse</div>
      <div id="headerWeather" class="text-xs md:text-sm font-semibold text-white/90 truncate"></div>
    </div>
    <div class="text-right text-xs shrink-0">
      <div id="syncStatus" class="px-2 py-1 rounded-full bg-white/20">checking...</div>
      <div id="appVersion" class="opacity-60 mt-1"></div>
    </div>
  </div>
</div>

<main class="p-3 max-w-4xl mx-auto">

  <!-- Home: one big tile per role, sized for wet hands and gloves. -->
  <section id="home" class="grid grid-cols-2 md:grid-cols-3 gap-3"></section>

  <!-- A role, full screen. Placeholder until its build stage lands. -->
  <section id="module" class="hidden">
    <div class="bg-white rounded-2xl shadow p-8 text-center">
      <i id="moduleIcon" class="text-6xl" style="color: var(--boord-blue)"></i>
      <div id="moduleName" class="text-2xl font-bold mt-4"></div>
      <div id="moduleBlurb" class="text-slate-500 mt-2"></div>
      <div class="inline-block mt-6 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-sm font-semibold">
        Not built yet
      </div>
    </div>
  </section>

  <!-- Settings PIN: four digits on a keypad big enough for gloves. -->
  <section id="pin" class="hidden">
    <div class="bg-white rounded-2xl shadow p-6 max-w-sm mx-auto text-center">
      <i class="fa-solid fa-lock text-4xl" style="color: var(--boord-blue)"></i>
      <div class="text-xl font-bold mt-3">Settings PIN</div>
      <div id="pinDots" class="flex justify-center gap-4 my-5"></div>
      <div id="pinError" class="text-red-600 text-sm min-h-[1.25rem] mb-2"></div>
      <div id="pinPad" class="grid grid-cols-3 gap-3"></div>
    </div>
  </section>

  <!-- Settings, once the PIN is in. Signed out again as soon as it is left. -->
  <section id="settings" class="hidden space-y-3 max-w-xl mx-auto">
    <div class="bg-white rounded-2xl shadow p-4">
      <div class="font-semibold mb-1">Packhouse settings</div>
      <div class="text-sm text-slate-500">The sulfur dose, tents, acid bath limits, lines and pallet sizes arrive here with their modules.</div>
    </div>
    <form id="pinChangeForm" class="bg-white rounded-2xl shadow p-4 space-y-3">
      <div class="font-semibold">Change the settings PIN</div>
      <input id="pinCurrent" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off"
             placeholder="Current PIN" class="w-full border border-slate-300 rounded-lg p-3 text-lg">
      <input id="pinNew" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off"
             placeholder="New 4-digit PIN" class="w-full border border-slate-300 rounded-lg p-3 text-lg">
      <button class="w-full boord-btn-primary rounded-lg py-3 font-semibold">Change PIN</button>
      <div class="text-xs text-slate-400">Every other tablet will need the new PIN.</div>
    </form>
  </section>

</main>

<nav class="fixed bottom-0 inset-x-0 bg-white border-t grid grid-cols-2 z-30 safe-bottom">
  <a href="#" data-nav="home" class="py-2 text-center text-sm"><i class="fa-solid fa-house text-2xl block"></i>Home</a>
  <a href="#settings" data-nav="settings" class="py-2 text-center text-sm"><i class="fa-solid fa-gear text-2xl block"></i>Settings</a>
</nav>

<script src="app.js"></script>
</body>
</html>
